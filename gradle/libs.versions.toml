# ============================================================================
#  Version Catalog —— 全工程唯一的版本号来源
#
#  改版本只改这里。别名使用 kebab-case，Gradle 会自动把 `-` 映射成 `.`
#  供 alias(...) 使用（例如 compose-bom -> libs.plugins... / libs.compose.bom）。
# ============================================================================

[versions]
# ---- 构建工具链 ----------------------------------------------------------
# AGP 8.7.x 需要 Gradle 8.9+ 与 JDK 17；CI 用 Java 17 + Gradle 8.11.1，匹配。
agp = "8.7.3"
# Kotlin 2.0 起 Compose 编译器随 Kotlin 一起发布，不再需要手动对齐
# kotlinCompilerExtensionVersion，这是本项目选 2.0.21 的主要原因。
kotlin = "2.0.21"

# ---- AndroidX / Compose ---------------------------------------------------
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
# BOM 负责统一 Compose 全家桶版本，下面的 compose-* 依赖都不写版本号。
composeBom = "2024.12.01"
coroutines = "1.9.0"

# ---- 持久化 / 网络 ---------------------------------------------------------
# Preferences DataStore：白名单、待办、AI 配置的落盘位置。
datastore = "1.1.7"
# OkHttp：OpenAI 兼容端点的 HTTP 客户端。刻意不用 Retrofit —— 只有两个请求
# （列模型、发一条测试消息），引入一整套注解处理器不划算。
okhttp = "4.12.0"

# ---- 摄像头 / 视觉 ---------------------------------------------------------
# CameraX 1.4.2：与 compileSdk 35 / AGP 8.7.3 同一代的稳定版本。
# 不追 1.5 / 1.6：那两条线要求 compileSdk 36，而本工程锁在 35。
# 只引 core / camera2 / lifecycle，**不引 camera-view** ——
# 后台注视检测不需要预览画面，少一个依赖少一份体积。
camera = "1.4.2"
# ML Kit 人脸检测（**打包版**）。选 com.google.mlkit 而不是
# com.google.android.gms:play-services-mlkit-face-detection：前者把模型打进 APK
# （约 +3~4MB），不依赖 Google Play 服务 —— 国产 ROM 上后者可能根本下不到模型。
mlkitFace = "16.1.7"

# ---- 测试 -----------------------------------------------------------------
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"

[libraries]
# ---- AndroidX 基础 --------------------------------------------------------
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# LifecycleService：让 Service 自带 LifecycleOwner，CameraX 的 bindToLifecycle 需要它。
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# ---- Compose（版本全部由 BOM 提供）----------------------------------------
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# 只用图标「核心集」（约 50 个），刻意不引 material-icons-extended：
# 那是个几万图标的巨型依赖，debug 构建会明显变慢、APK 也会虚胖。
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }

# ---- 持久化 / 网络 ---------------------------------------------------------
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# ---- 协程 -----------------------------------------------------------------
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# ---- 摄像头 / 视觉 ---------------------------------------------------------
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camera" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camera" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camera" }
mlkit-face-detection = { group = "com.google.mlkit", name = "face-detection", version.ref = "mlkitFace" }

# ---- 测试 -----------------------------------------------------------------
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
