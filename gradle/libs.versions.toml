# ============================================================================
#  Version Catalog —— 全工程唯一的版本号来源
#
#  改版本只改这里。别名使用 kebab-case，Gradle 会自动把 `-` 映射成 `.`
#  供 alias(...) 使用（例如 compose-bom -> libs.plugins... / libs.compose.bom）。
# ============================================================================

[versions]
# ---- 构建工具链 ----------------------------------------------------------
# AGP 8.7.x 需要 Gradle 8.9+ 与 JDK 17；CI 用 Java 17 + Gradle 8.11.1，匹配。
agp = "8.7.3"
# Kotlin 2.0 起 Compose 编译器随 Kotlin 一起发布，不再需要手动对齐
# kotlinCompilerExtensionVersion，这是本项目选 2.0.21 的主要原因。
kotlin = "2.0.21"

# ---- AndroidX / Compose ---------------------------------------------------
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
# BOM 负责统一 Compose 全家桶版本，下面的 compose-* 依赖都不写版本号。
composeBom = "2024.12.01"
coroutines = "1.9.0"

# ---- 持久化 / 网络 ---------------------------------------------------------
# Preferences DataStore：白名单、待办、AI 配置的落盘位置。
datastore = "1.1.7"
# OkHttp：OpenAI 兼容端点的 HTTP 客户端。刻意不用 Retrofit —— 只有两个请求
# （列模型、发一条测试消息），引入一整套注解处理器不划算。
okhttp = "4.12.0"

# ---- 摄像头 / 视觉 ---------------------------------------------------------
# CameraX 1.4.2：minCompileSdk 34 / minAGP 1.0，本工程（compileSdk 35 + AGP 8.7.3）
# 完全够用。为什么不追新：
#   - 1.6.x 要求 compileSdk 36 + AGP 8.9.1，用不了；
#   - 1.5.x 能用（minCompileSdk 35），但它自 1.5.0-alpha04 起改用 JSpecify 类型注解，
#     Kotlin 2.0.21 编译时会刷一批 jspecify 告警。本工程的标准是零告警，
#     所以停在 1.4.2；将来升 Kotlin 2.1+（jspecify 默认 strict）再一起升到 1.5.3。
# 只引 core / camera2 / lifecycle，**不引 camera-view** ——
# 后台注视检测没有预览画面，少一个依赖少一份体积。
camera = "1.4.2"
# ML Kit 人脸检测（**模型打包版**）。
#
# 选 com.google.mlkit 而不是 com.google.android.gms:play-services-mlkit-face-detection：
# 后者只有 330 KB，但模型要靠 Google Play 服务在运行时下载，没有 GMS 的机型直接不可用。
# 打包版把 .so 与模型放进 APK（官方口径 +6.9 MB，实测 AAR 约 16.9 MiB）。
#
# ⚠️ 但**不能**就此宣称「打包版不需要 GMS」：它的 POM 仍然传递依赖
# play-services-base / -basement / -tasks 等支撑库，官方也没有一句明文保证无 GMS 可用。
# 所以代码里对初始化与检测失败都做了兜底（失败只发一条错误状态，不影响其它功能），
# 真机是国产无 GMS ROM 的话需要实测一次。
mlkitFace = "16.1.7"

# ---- 本地向量模型 ---------------------------------------------------------
# ONNX Runtime：跑下载到本机的 all-MiniLM-L6-v2 量化模型。
#
# 体积账：AAR 26MB（含 arm64-v8a / armeabi-v7a / x86 / x86_64 四个 ABI），
# 我们的 abiFilters 只留 arm64-v8a 与 armeabi-v7a，实际进包约 +13MB。
# 换来的是记忆检索完全离线、不花钱、不把最私密的一类数据发出去。
#
# 用 onnxruntime-android 而不是 onnxruntime-mobile：后者体积更小，但只支持
# 转换成 ORT 格式的模型，而用户的模型是 quantize 出来的标准 ONNX，
# 直接跑不了。
onnxRuntime = "1.20.0"


# ML Kit 中文文本识别（**模型打包版**）。
#
# 选打包版而不是 play-services 版：后者靠 Google Play 服务在运行时下载模型，
# 没有 GMS 的机型直接不可用 —— 而本项目的端侧识图恰恰是给「不想联网」的人用的。
# 代价是 APK 里多约 10MB 的原生组件。
mlkitTextChinese = "16.0.1"

# ---- 测试 -----------------------------------------------------------------
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"

[libraries]
# ---- AndroidX 基础 --------------------------------------------------------
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# LifecycleService：让 Service 自带 LifecycleOwner，CameraX 的 bindToLifecycle 需要它。
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# ---- Compose（版本全部由 BOM 提供）----------------------------------------
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# 只用图标「核心集」（约 50 个），刻意不引 material-icons-extended：
# 那是个几万图标的巨型依赖，debug 构建会明显变慢、APK 也会虚胖。
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }

# ---- 持久化 / 网络 ---------------------------------------------------------
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# ---- 协程 -----------------------------------------------------------------
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# ---- 摄像头 / 视觉 ---------------------------------------------------------
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camera" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camera" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camera" }
mlkit-face-detection = { group = "com.google.mlkit", name = "face-detection", version.ref = "mlkitFace" }

# ---- 本地向量模型 ---------------------------------------------------------
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxRuntime" }

mlkit-text-recognition-chinese = { group = "com.google.mlkit", name = "text-recognition-chinese", version.ref = "mlkitTextChinese" }

# ---- 测试 -----------------------------------------------------------------
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
