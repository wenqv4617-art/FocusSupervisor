# ============================================================================
#  FocusSupervisor —— 自动打包 debug APK
#
#  触发：push 到 main，或在 Actions 页面手动 workflow_dispatch。
#  产物：app-debug.apk，作为 artifact 上传，保留 7 天，用户在网页上自行下载。
#
#  刻意只打 debug：debug 包由 AGP 用自动生成的 debug 密钥签名，装得上、可直接
#  覆盖安装；release 需要签名密钥，等仓库 Secrets 配好之后再加一个 job。
# ============================================================================

name: Build Debug APK

on:
  push:
    branches: [main]
  # 手动触发：Actions → 左侧选本 workflow → Run workflow。
  workflow_dispatch:

# 同一分支上新的推送会取消还在跑的旧构建，省 Actions 额度。
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble-debug:
    name: assembleDebug
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        # 不引 android-actions/setup-android：它默认会去装早已从 SDK 下线的
        # `tools` 包，直接让这一步失败。ubuntu-latest 镜像已经预装了 SDK、
        # build-tools 和已接受的 license，这里只做两件事：
        #   1) 把环境打印出来，方便出问题时定位；
        #   2) 万一少了 android-35，就地补装 —— 失败也不中断，留给 AGP
        #      自己的 sdkDownload 兜底。
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK"
          echo "--- 现有 platforms ---"; ls "$SDK/platforms" 2>/dev/null || echo "(空)"
          echo "--- 现有 build-tools ---"; ls "$SDK/build-tools" 2>/dev/null || echo "(空)"

          if [ ! -d "$SDK/platforms/android-35" ] || [ ! -d "$SDK/build-tools/35.0.0" ]; then
            SDKMGR="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
            if [ -n "$SDKMGR" ]; then
              echo "用 $SDKMGR 安装 platforms;android-35 与 build-tools;35.0.0"
              yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
              "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" || true
            else
              echo "未找到 sdkmanager，交给 AGP 自动下载"
            fi
          fi

          echo "--- 最终 platforms ---"; ls "$SDK/platforms" 2>/dev/null || true

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 环境自检
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ./gradlew --version

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 编译 debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 列出产物（便于排查）
        if: always()
        run: find app/build/outputs -type f -name '*.apk' -print 2>/dev/null || true

      - name: 上传 app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: FocusSupervisor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: 构建失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          retention-days: 7
          if-no-files-found: ignore
